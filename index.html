<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07030c">
  <meta name="description" content="VeinViper — undefeated. Enter the dark side and follow VeinViper across Instagram, YouTube, Telegram, and Discord.">
  <meta property="og:title" content="VeinViper — Undefeated">
  <meta property="og:description" content="Enter the dark side. Follow VeinViper.">
  <meta property="og:type" content="website">
  <title>VeinViper — Undefeated • Follow Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #050308;
      --panel: rgba(16, 8, 24, .72);
      --purple: #9d31ff;
      --violet: #d5a0ff;
      --red: #ff244e;
      --muted: #a99db5;
      --line: rgba(190, 105, 255, .22);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: auto; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; overflow-y: hidden; color: #fff;
      background: radial-gradient(ellipse at 50% 38%, #210b35 0%, #10071a 29%, #07040c 63%, #030205 100%);
      font-family: Inter, system-ui, sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(155,37,255,.035) 49%, transparent 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px);
      opacity: .55;
    }
    body::after {
      content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 0 28%, rgba(0,0,0,.38) 72%);
    }
    a { color: inherit; }
    .scene { position: relative; isolation: isolate; height: 100svh; min-height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
    .ambient {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse at 7% 40%, rgba(255,22,65,.12), transparent 28%),
        radial-gradient(ellipse at 92% 39%, rgba(139,22,255,.15), transparent 30%),
        radial-gradient(ellipse at 50% 95%, rgba(96,15,156,.15), transparent 38%);
    }
    .grid {
      position: fixed; left: -25%; right: -25%; bottom: -31%; height: 67vh; z-index: -1;
      opacity: .19; pointer-events: none; transform: perspective(360px) rotateX(62deg);
      transform-origin: center top;
      background-image: linear-gradient(rgba(166,69,255,.38) 1px, transparent 1px), linear-gradient(90deg, rgba(166,69,255,.38) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
      animation: gridDrift 14s linear infinite;
    }
    .scanline {
      position: fixed; left: 0; right: 0; top: -15%; height: 13vh; z-index: 5; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(198,99,255,.035), rgba(255,42,80,.045), transparent);
      animation: scan 10s linear infinite;
    }
    .topbar {
      width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 18px;
      position: relative; z-index: 3;
    }
    .brandmark { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 12px Orbitron, sans-serif; letter-spacing: .19em; }
    .brandmark .sigil {
      width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,43,82,.65);
      border-radius: 9px; color: var(--red); box-shadow: 0 0 18px rgba(255,25,65,.18), inset 0 0 14px rgba(255,25,65,.12);
    }
    .status { display: flex; align-items: center; gap: 9px; color: #c4b5d0; font-size: 10px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff315b; box-shadow: 0 0 12px #ff315b; animation: pulse 1.7s ease-in-out infinite; }
    main {
      flex: 1; width: min(1180px, 100%); margin: 0 auto; padding: 34px 24px 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2;
    }
    .hero { width: 100%; text-align: center; position: relative; padding: 26px 0 0; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 12px; margin-bottom: 23px; color: #d7b6ef;
      font-size: 10px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after { content: ""; width: 29px; height: 1px; background: linear-gradient(90deg, transparent, #a34cff); }
    .eyebrow::after { transform: rotate(180deg); }
    .title-wrap { position: relative; display: block; width: 100%; max-width: 100%; margin-inline: auto; text-align: center; }
    .title-wrap h1 { width: 100%; text-align: center; }
    h1 {
      margin: 0; position: relative; z-index: 1; font: 900 clamp(2.8rem, 8.7vw, 7.9rem)/.98 Orbitron, sans-serif;
      letter-spacing: -.065em; white-space: nowrap; color: #fff;
      text-shadow: 0 0 4px #fff, 0 0 15px rgba(204,115,255,.9), 0 0 37px rgba(156,42,255,.78), 0 0 84px rgba(138,26,255,.42);
      animation: titleGlow 4.8s ease-in-out infinite;
    }
    h1::after {
      content: "VeinViper"; position: absolute; inset: 0; z-index: -1; color: #f52c54;
      filter: blur(19px); opacity: .42; animation: redPulse 3.5s ease-in-out infinite;
    }
    .title-rule { height: 1px; width: min(420px, 70%); margin: 22px auto 0; background: linear-gradient(90deg, transparent, rgba(255,35,82,.8), rgba(175,76,255,.9), transparent); box-shadow: 0 0 16px rgba(174,53,255,.65); }
    .subtitle { margin: 17px 0 0; font: 700 clamp(.7rem, 1.6vw, .88rem) Orbitron, sans-serif; letter-spacing: .37em; color: #f5eaff; }
    .subtitle span { color: var(--red); padding: 0 .32em; text-shadow: 0 0 12px rgba(255,36,78,.8); }
    .intro { max-width: 460px; margin: 17px auto 0; color: #b9a9c7; font-size: 13px; line-height: 1.8; letter-spacing: .015em; }
    .rings { position: absolute; width: min(660px, 80vw); aspect-ratio: 1; left: 50%; top: 48%; transform: translate(-50%,-50%); z-index: -1; pointer-events: none; }
    .ring { position: absolute; inset: 0; border: 1px solid rgba(174,72,255,.13); border-radius: 50%; box-shadow: 0 0 28px rgba(126,24,255,.04), inset 0 0 25px rgba(151,36,255,.04); animation: ringSpin 26s linear infinite; }
    .ring:nth-child(2) { inset: 9%; border-style: dashed; border-color: rgba(255,42,81,.16); animation-direction: reverse; animation-duration: 38s; }
    .ring:nth-child(3) { inset: 19%; border-color: rgba(173,83,255,.18); animation-duration: 19s; }
    .ring::before { content: ""; position: absolute; top: 13%; left: 18%; width: 5px; height: 5px; border-radius: 50%; background: #f84c84; box-shadow: 0 0 14px 4px rgba(255,38,94,.5); }
    .socials { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; width: min(850px, 100%); margin: 48px auto 0; }
    .social-card {
      --accent: #bb67ff; position: relative; min-height: 122px; padding: 21px 17px 18px; overflow: hidden;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 17px;
      text-decoration: none; border: 1px solid rgba(189,117,255,.22); border-radius: 13px;
      background: linear-gradient(145deg, rgba(37,18,51,.76), rgba(9,6,15,.84));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 12px 35px rgba(0,0,0,.23);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease, background .28s ease;
    }
    .social-card::before { content: ""; position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 65%); transition: opacity .3s ease; pointer-events: none; }
    .social-card::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); transform: scaleX(.18); opacity: .65; transition: transform .3s ease; }
    .social-card:hover, .social-card:focus-visible { transform: translateY(-7px); border-color: color-mix(in srgb, var(--accent) 72%, white 10%); box-shadow: 0 15px 42px rgba(0,0,0,.4), 0 0 25px color-mix(in srgb, var(--accent) 17%, transparent), inset 0 1px 0 rgba(255,255,255,.08); outline: none; }
    .social-card:hover::before, .social-card:focus-visible::before { opacity: 1; }
    .social-card:hover::after, .social-card:focus-visible::after { transform: scaleX(1); }
    .social-card .top { display: flex; width: 100%; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .social-card .iconbox { width: 38px; height: 38px; display: grid; place-items: center; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 10px; }
    .social-card svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .social-card .arrow { width: 15px; height: 15px; color: #887693; transition: transform .25s ease, color .25s ease; }
    .social-card:hover .arrow { transform: translate(3px,-3px); color: var(--accent); }
    .social-card .label { position: relative; z-index: 1; display: block; font-size: 13px; font-weight: 700; letter-spacing: .015em; }
    .social-card .handle { display: block; margin-top: 5px; font-size: 10px; color: #a899b5; letter-spacing: .035em; }
    .instagram { --accent: #ff5aa8; } .youtube { --accent: #ff354f; } .telegram { --accent: #64c8ff; } .discord { --accent: #a78bff; }
    .bottom-note { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 27px; color: #756581; font-size: 9px; font-weight: 700; letter-spacing: .23em; text-transform: uppercase; }
    .bottom-note::before, .bottom-note::after { content: ""; width: 20px; height: 1px; background: #49215f; }
    footer { position: relative; z-index: 2; text-align: center; padding: 17px 20px 24px; color: #71647c; font-size: 10px; letter-spacing: .07em; }
    .footer-mark { color: #a48ab8; }
    #particles { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .fog { position: fixed; inset: auto -15% -10%; height: 45vh; z-index: 0; pointer-events: none; opacity: .22; filter: blur(35px); background: radial-gradient(ellipse at 25% 55%, rgba(113,24,150,.42), transparent 48%), radial-gradient(ellipse at 70% 40%, rgba(175,20,53,.28), transparent 42%); animation: fogDrift 15s ease-in-out infinite alternate; }
    @keyframes titleGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }
    @keyframes redPulse { 0%,100% { opacity: .28; } 50% { opacity: .6; } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(125vh); } }
    @keyframes gridDrift { to { background-position: 0 54px, 54px 0; } } 50% { translate: 0 -9px; } }
    @keyframes fogDrift { from { transform: translateX(-3%) scale(1); } to { transform: translateX(4%) scale(1.12); } }
    @media (max-width: 900px) {
      main { padding-top: 30px; }
      .socials { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 570px; margin-top: 38px; }
      .social-card { min-height: 108px; }
      .rings { width: 75vw; }
    }
    @media (max-width: 520px) {
      .topbar { width: calc(100% - 34px); padding-top: 20px; }
      .brandmark { font-size: 10px; letter-spacing: .13em; }
      .status { font-size: 8px; letter-spacing: .12em; }
      main { padding: 35px 19px 30px; }
      .hero { padding-top: 22px; }
      .eyebrow { font-size: 8px; letter-spacing: .22em; margin-bottom: 19px; }
      h1 { font-size: clamp(2.25rem, 10.6vw, 3.35rem); letter-spacing: -.075em; }
      .subtitle { letter-spacing: .22em; font-size: .67rem; }
      .intro { font-size: 12px; max-width: 310px; }
      .socials { gap: 10px; margin-top: 32px; }
      .social-card { padding: 15px 13px; min-height: 105px; border-radius: 11px; }
      .social-card .iconbox { width: 34px; height: 34px; }
      .social-card .label { font-size: 12px; }
      .social-card .handle { font-size: 9px; }
      .rings { width: 92vw; top: 45%; }
      .bottom-note { font-size: 8px; letter-spacing: .14em; }
      footer { font-size: 9px; }
    }
    @media (max-width: 350px) {
      .status { display: none; }
      h1 { font-size: 2rem; }
      .social-card { padding: 13px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .010ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      #particles { display: none; }
    }
  </style>
</head>
<body>
<div class="scene">
  <div class="ambient" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- Decorative, original inline SVG serpents. Kept outside the content column. -->

  <header class="topbar">
    <a class="brandmark" href="#" aria-label="VeinViper home">
      <span class="sigil" aria-hidden="true">V</span><span>VeinViper</span>
    </a>
    <div class="status"><span class="status-dot" aria-hidden="true"></span> THE DEN IS OPEN</div>
  </header>

  <main>
    <section class="hero" aria-labelledby="main-title">
      <div class="rings" aria-hidden="true"><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
      <div class="eyebrow">ENTER THE DARK SIDE</div>
      <div class="title-wrap"><h1 id="main-title">VeinViper</h1></div>
      <div class="title-rule" aria-hidden="true"></div>
      <p class="subtitle">UNDEFEATED <span>•</span> FOLLOW US</p>
      <p class="intro"> <span>•</span> Gaming Community <span>•</span> </p>
      <p class="intro"> <span>•</span> Built By Gamers For Gamers <span>•</span> </p>

      <nav class="socials" aria-label="Follow VeinViper on social media">
        <a class="social-card instagram" href="https://www.instagram.com/veinofviper/" target="_blank" rel="noopener noreferrer" aria-label="Follow VeinViper on Instagram, opens in a new tab">
          <span class="top"><span class="iconbox" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.6 6.6h.01"/></svg></span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
          <span class="label">Instagram<span class="handle">@veinviper</span></span>
        </a>
        <a class="social-card youtube" href="https://www.youtube.com/@VeinsOfViper" target="_blank" rel="noopener noreferrer" aria-label="Subscribe to VeinViper on YouTube, opens in a new tab">
          <span class="top"><span class="iconbox" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></svg></span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
          <span class="label">YouTube<span class="handle">@veinviper</span></span>
        </a>
        <a class="social-card telegram" href="https://t.me/veinviper" target="_blank" rel="noopener noreferrer" aria-label="Join VeinViper on Telegram, opens in a new tab">
          <span class="top"><span class="iconbox" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m21 3-7.2 18-3.9-7.2L3 10.2 21 3Z"/><path d="m9.9 13.8 5.2-5.2"/></svg></span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
          <span class="label">Telegram<span class="handle">@veinviper</span></span>
        </a>
        <a class="social-card discord" href="https://discord.gg/VcxqbT9sRC" target="_blank" rel="noopener noreferrer" aria-label="Join the VeinViper Discord, opens in a new tab">
          <span class="top"><span class="iconbox" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 6.5a15 15 0 0 1 10 0l2.2 11a16 16 0 0 1-4.1 2l-1-1.7M10 17.8l-1 1.7a16 16 0 0 1-4.1-2l2.2-11"/><path d="M8.5 14.5h.01M15.5 14.5h.01M8.5 14.5a4 4 0 0 0 7 0"/></svg></span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>

      <div class="bottom-note">Goated Gamer</div>

  </main>

  <footer><span class="footer-mark">© 2026 VeinViper.</span> All rights reserved.</footer>
</div>
<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width = 0, height = 0, particles = [], raf = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(72, Math.max(22, Math.floor(width * height / 18000)));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width, y: Math.random() * height,
      r: Math.random() * 1.4 + .35, vy: Math.random() * .34 + .08,
      vx: (Math.random() - .5) * .18, a: Math.random() * .45 + .12,
      phase: Math.random() * Math.PI * 2, red: Math.random() > .76
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, width, height);
    for (const p of particles) {
      p.y -= p.vy; p.x += p.vx; p.phase += .018;
      if (p.y < -5) { p.y = height + 5; p.x = Math.random() * width; }
      if (p.x < -5) p.x = width + 5;
      if (p.x > width + 5) p.x = -5;
      const alpha = p.a * (.65 + Math.sin(p.phase) * .35);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.red ? `rgba(255,48,83,${alpha})` : `rgba(196,125,255,${alpha})`;
      ctx.shadowBlur = p.r > 1.2 ? 9 : 3;
      ctx.shadowColor = p.red ? '#ff244e' : '#a43cff';
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    raf = requestAnimationFrame(draw);
  }
  if (!reducedMotion && ctx) {
    resize(); draw();
    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else if (!reducedMotion) draw();
    });
  }
})();
</script>
</body>
